; ESP32-S3 Betaflight-inspired flight controller
; Targets arduino-esp32 2.0.x (PlatformIO espressif32 6.x) because DShot uses the legacy RMT driver.
[env:esp32s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dio
board_upload.flash_size = 4MB
board_build.partitions = default.csv          ; 4 MB, two OTA app slots
build_flags =
  -O2
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCONFIG_ASYNC_TCP_RUNNING_CORE=0        ; keep all network work on Core 0
  -DCONFIG_ASYNC_TCP_STACK_SIZE=8192
  -DWS_MAX_QUEUED_MESSAGES=8
lib_deps =
  ESP32Async/AsyncTCP@^3.3.2
  ESP32Async/ESPAsyncWebServer@^3.7.0