; ESP32-S3 Betaflight-inspired flight controller - one firmware for every ESP32-S3 board.
; The env only picks the *default* pin preset; everything can be re-mapped later in the web "Pins & IMU" tab.
; Targets arduino-esp32 2.0.x (PlatformIO espressif32 6.x) because DShot uses the legacy RMT driver.
; Verified to compile with arduino-esp32 2.0.17, AsyncTCP 3.5.0, ESPAsyncWebServer 3.12.1.
[platformio]
default_envs = zero

[env]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dio
board_upload.flash_size = 4MB                 ; works on 4/8/16 MB modules
board_build.partitions = default.csv          ; two OTA app slots
build_flags =
  -O2
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCONFIG_ASYNC_TCP_RUNNING_CORE=0           ; keep all network work on Core 0
  -DCONFIG_ASYNC_TCP_STACK_SIZE=8192
  -DWS_MAX_QUEUED_MESSAGES=8
lib_deps =
  ESP32Async/AsyncTCP@^3.5.0
  ESP32Async/ESPAsyncWebServer@^3.12.1

[env:zero]                                    ; Waveshare ESP32-S3-Zero (default)
build_flags = ${env.build_flags} -DFC_BOARD=0

[env:supermini]                               ; ESP32-S3 Super Mini
build_flags = ${env.build_flags} -DFC_BOARD=1

[env:xiao]                                    ; Seeed Studio XIAO ESP32S3
build_flags = ${env.build_flags} -DFC_BOARD=2

[env:devkitc]                                 ; Espressif ESP32-S3-DevKitC-1
build_flags = ${env.build_flags} -DFC_BOARD=3

[env:generic]                                 ; any other ESP32-S3 module
build_flags = ${env.build_flags} -DFC_BOARD=4
