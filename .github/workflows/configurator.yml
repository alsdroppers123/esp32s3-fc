name: Build configurator app

on:
  push:
    paths:
      - 'configurator-app/**'
      - '.github/workflows/configurator.yml'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: configurator-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # unsigned dev build on macOS
      - uses: actions/upload-artifact@v4
        with:
          name: configurator-${{ matrix.os }}
          path: |
            configurator-app/dist/*.exe
            configurator-app/dist/*.AppImage
            configurator-app/dist/*.dmg
          if-no-files-found: error
